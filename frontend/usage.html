<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>2. Water Usage Questionnaire</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet"
    >

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    },

                    fontFamily: {
                        sans: [
                            'Plus Jakarta Sans',
                            'sans-serif'
                        ],
                    }
                }
            }
        };
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overscroll-behavior-y: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>


<body
    class="bg-gradient-to-b from-sky-50 via-white to-sky-50 text-slate-800 min-h-screen flex flex-col justify-between overflow-y-auto"
>


    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header
        class="sticky top-0 z-30 bg-white/85 backdrop-blur-md border-b border-sky-100 px-4 py-3"
    >

        <div
            class="max-w-md mx-auto flex items-center justify-between"
        >

            <div class="flex items-center gap-2.5">

                <a
                    href="#"
                    class="w-8 h-8 rounded-full bg-sky-50 hover:bg-sky-100 flex items-center justify-center text-slate-600 transition-colors"
                >
                    <span class="material-symbols-outlined text-[18px]">
                        arrow_back
                    </span>
                </a>


                <div class="flex flex-col">

                    <div class="flex items-center gap-1.5">

                        <svg
                            class="w-5 h-5 text-brand-500"
                            viewBox="0 0 48 48"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M6 16C12 12 18 20 24 16C30 12 36 20 42 16"
                                stroke="currentColor"
                                stroke-width="4.5"
                                stroke-linecap="round"
                            />

                            <path
                                d="M6 24C12 20 18 28 24 24C30 20 36 28 42 24"
                                stroke="currentColor"
                                stroke-width="4.5"
                                stroke-linecap="round"
                            />

                            <path
                                d="M6 32C12 28 18 36 24 32C30 28 36 36 42 32"
                                stroke="currentColor"
                                stroke-width="4.5"
                                stroke-linecap="round"
                            />
                        </svg>


                        <span
                            class="text-base font-extrabold tracking-tight text-brand-600 leading-none"
                        >
                            LEAKLENS
                        </span>

                    </div>


                    <span
                        class="text-[10px] font-bold text-brand-400 tracking-wide leading-tight"
                    >
                        The water you can't see
                    </span>

                </div>

            </div>


            <!-- Avatar -->

            <div
                class="w-9 h-9 rounded-full bg-gradient-to-tr from-brand-400 to-brand-500 text-white flex items-center justify-center shadow-sm ring-2 ring-sky-100"
            >
                <span class="material-symbols-outlined text-[20px]">
                    account_circle
                </span>
            </div>

        </div>

    </header>



    <!-- ========================= -->
    <!-- MAIN -->
    <!-- ========================= -->

    <main
        class="w-full max-w-md mx-auto px-5 py-6 flex-1 flex flex-col gap-6"
    >


        <!-- ========================= -->
        <!-- PROGRESS -->
        <!-- ========================= -->

        <div
            class="bg-white p-4 rounded-2xl border border-sky-100 shadow-sm"
        >

            <div
                class="flex items-center justify-between mb-2"
            >

                <span
                    class="text-xs font-bold text-slate-500 uppercase tracking-wider"
                >
                    Step 1 of 2
                </span>

                <span
                    class="text-xs font-extrabold text-brand-500"
                >
                    50% Completed
                </span>

            </div>


            <div
                class="w-full h-2.5 bg-sky-100 rounded-full overflow-hidden p-0.5"
            >

                <div
                    class="h-full bg-gradient-to-r from-brand-400 to-brand-500 rounded-full transition-all duration-500"
                    style="width: 50%;"
                ></div>

            </div>

        </div>



        <!-- ========================= -->
        <!-- TITLE -->
        <!-- ========================= -->

        <div>

            <h1
                class="text-2xl font-bold text-slate-800 tracking-tight"
            >
                Your Water Usage
            </h1>

            <p
                class="text-xs text-slate-500 mt-1"
            >
                Help our AI establish your baseline household consumption.
            </p>

        </div>



        <!-- ========================= -->
        <!-- MONTHLY USAGE -->
        <!-- ========================= -->

        <section class="space-y-3">

            <label
                class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5"
            >

                <span
                    class="material-symbols-outlined text-brand-500 text-[18px]"
                >
                    water_drop
                </span>

                Monthly Volume Range

            </label>



            <div
                class="grid grid-cols-1 gap-2.5"
                id="usage-cards"
            >


                <!-- LOW -->

                <button
                    type="button"
                    class="usage-tier w-full p-4 rounded-2xl bg-white border border-sky-100 hover:border-brand-300 text-left flex items-center justify-between shadow-sm transition-all active:scale-[0.99]"
                >

                    <div class="flex items-center gap-3">

                        <div
                            class="w-11 h-11 rounded-xl bg-sky-50 text-brand-500 flex items-center justify-center"
                        >
                            <span class="material-symbols-outlined text-[22px]">
                                person
                            </span>
                        </div>


                        <div>

                            <div
                                class="text-sm font-bold text-slate-800"
                            >
                                Low Usage
                            </div>

                            <div
                                class="text-xs text-slate-500"
                            >
                                1 – 2 persons (~10 m³/month)
                            </div>

                        </div>

                    </div>


                    <div
                        class="w-6 h-6 rounded-full border-2 border-slate-200 flex items-center justify-center tier-radio"
                    ></div>

                </button>



                <!-- MEDIUM -->

                <button
                    type="button"
                    class="usage-tier active-tier w-full p-4 rounded-2xl bg-sky-50/80 border-2 border-brand-400 text-left flex items-center justify-between shadow-sm transition-all active:scale-[0.99]"
                >

                    <div class="flex items-center gap-3">

                        <div
                            class="w-11 h-11 rounded-xl bg-brand-400 text-white flex items-center justify-center shadow-sm"
                        >
                            <span class="material-symbols-outlined text-[22px]">
                                group
                            </span>
                        </div>


                        <div>

                            <div
                                class="text-sm font-bold text-slate-800"
                            >
                                Medium Usage
                            </div>

                            <div
                                class="text-xs text-slate-500"
                            >
                                Standard Family (~20 m³/month)
                            </div>

                        </div>

                    </div>


                    <div
                        class="w-6 h-6 rounded-full bg-brand-500 text-white flex items-center justify-center tier-radio shadow-sm"
                    >

                        <span
                            class="material-symbols-outlined text-[16px] font-bold"
                        >
                            check
                        </span>

                    </div>

                </button>



                <!-- HIGH -->

                <button
                    type="button"
                    class="usage-tier w-full p-4 rounded-2xl bg-white border border-sky-100 hover:border-brand-300 text-left flex items-center justify-between shadow-sm transition-all active:scale-[0.99]"
                >

                    <div class="flex items-center gap-3">

                        <div
                            class="w-11 h-11 rounded-xl bg-sky-50 text-brand-500 flex items-center justify-center"
                        >
                            <span class="material-symbols-outlined text-[22px]">
                                yard
                            </span>
                        </div>


                        <div>

                            <div
                                class="text-sm font-bold text-slate-800"
                            >
                                High Usage
                            </div>

                            <div
                                class="text-xs text-slate-500"
                            >
                                House with Garden (~35+ m³/month)
                            </div>

                        </div>

                    </div>


                    <div
                        class="w-6 h-6 rounded-full border-2 border-slate-200 flex items-center justify-center tier-radio"
                    ></div>

                </button>

            </div>



            <!-- SLIDER -->

            <div
                class="bg-white p-4 rounded-2xl border border-sky-100 shadow-sm mt-3"
            >

                <div
                    class="flex items-center justify-between text-xs font-semibold text-slate-600 mb-2"
                >

                    <span>
                        Fine-tune estimate:
                    </span>

                    <span
                        class="text-sm font-extrabold text-brand-500"
                    >

                        <span id="val-display">
                            20
                        </span>

                        m³/mo

                    </span>

                </div>


                <input
                    id="usage-slider"
                    type="range"
                    min="5"
                    max="60"
                    value="20"
                    class="w-full accent-brand-500 h-2 bg-sky-100 rounded-lg cursor-pointer"
                >


                <div
                    class="flex justify-between text-[10px] text-slate-400 mt-1 font-medium"
                >

                    <span>5 m³</span>
                    <span>30 m³</span>
                    <span>60+ m³</span>

                </div>

            </div>

        </section>



        <!-- ========================= -->
        <!-- USAGE HOURS -->
        <!-- ========================= -->

        <section
            class="space-y-3"
            id="usage-hours-section"
        >

            <label
                class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5"
            >

                <span
                    class="material-symbols-outlined text-brand-500 text-[18px]"
                >
                    schedule
                </span>

                Usual Usage Hours

            </label>


            <div
                class="grid grid-cols-2 gap-2.5"
            >


                <!-- MORNING -->

                <button
                    type="button"
                    data-hour="morning"
                    class="usage-hour p-3.5 rounded-2xl bg-sky-50/70 border border-brand-300 text-left flex flex-col gap-2 transition-all active:scale-95 shadow-sm"
                >

                    <div
                        class="flex items-center justify-between"
                    >

                        <div
                            class="w-8 h-8 rounded-lg bg-brand-400 text-white flex items-center justify-center shadow-sm"
                        >

                            <span
                                class="material-symbols-outlined text-[18px]"
                            >
                                wb_twilight
                            </span>

                        </div>


                        <span
                            class="material-symbols-outlined text-brand-500 text-[18px] hour-check"
                        >
                            check_circle
                        </span>

                    </div>


                    <div>

                        <div
                            class="text-xs font-bold text-slate-800"
                        >
                            Morning
                        </div>

                        <div
                            class="text-[11px] text-slate-500"
                        >
                            06:00 – 09:00
                        </div>

                    </div>

                </button>



                <!-- AFTERNOON -->

                <button
                    type="button"
                    data-hour="afternoon"
                    class="usage-hour p-3.5 rounded-2xl bg-white border border-sky-100 text-left flex flex-col gap-2 transition-all active:scale-95 shadow-sm"
                >

                    <div
                        class="flex items-center justify-between"
                    >

                        <div
                            class="w-8 h-8 rounded-lg bg-sky-50 text-slate-500 flex items-center justify-center"
                        >

                            <span
                                class="material-symbols-outlined text-[18px]"
                            >
                                sunny
                            </span>

                        </div>


                        <span
                            class="material-symbols-outlined text-slate-300 text-[18px] hour-check"
                        >
                            radio_button_unchecked
                        </span>

                    </div>


                    <div>

                        <div
                            class="text-xs font-bold text-slate-800"
                        >
                            Afternoon
                        </div>

                        <div
                            class="text-[11px] text-slate-500"
                        >
                            12:00 – 14:00
                        </div>

                    </div>

                </button>



                <!-- EVENING -->

                <button
                    type="button"
                    data-hour="evening"
                    class="usage-hour p-3.5 rounded-2xl bg-sky-50/70 border border-brand-300 text-left flex flex-col gap-2 transition-all active:scale-95 shadow-sm"
                >

                    <div
                        class="flex items-center justify-between"
                    >

                        <div
                            class="w-8 h-8 rounded-lg bg-brand-400 text-white flex items-center justify-center shadow-sm"
                        >

                            <span
                                class="material-symbols-outlined text-[18px]"
                            >
                                nights_stay
                            </span>

                        </div>


                        <span
                            class="material-symbols-outlined text-brand-500 text-[18px] hour-check"
                        >
                            check_circle
                        </span>

                    </div>


                    <div>

                        <div
                            class="text-xs font-bold text-slate-800"
                        >
                            Evening
                        </div>

                        <div
                            class="text-[11px] text-slate-500"
                        >
                            18:00 – 22:00
                        </div>

                    </div>

                </button>



                <!-- NIGHT -->

                <button
                    type="button"
                    data-hour="night"
                    class="usage-hour p-3.5 rounded-2xl bg-white border border-sky-100 text-left flex flex-col gap-2 transition-all active:scale-95 shadow-sm"
                >

                    <div
                        class="flex items-center justify-between"
                    >

                        <div
                            class="w-8 h-8 rounded-lg bg-sky-50 text-slate-500 flex items-center justify-center"
                        >

                            <span
                                class="material-symbols-outlined text-[18px]"
                            >
                                bedtime
                            </span>

                        </div>


                        <span
                            class="material-symbols-outlined text-slate-300 text-[18px] hour-check"
                        >
                            radio_button_unchecked
                        </span>

                    </div>


                    <div>

                        <div
                            class="text-xs font-bold text-slate-800"
                        >
                            Night
                        </div>

                        <div
                            class="text-[11px] text-slate-500"
                        >
                            23:00 – 05:00
                        </div>

                    </div>

                </button>

            </div>

        </section>



        <!-- ========================= -->
        <!-- CONTINUE BUTTON -->
        <!-- ========================= -->

        <div
            class="pt-4 pb-8"
        >

            <button
                id="continue-to-fixtures"
                type="button"
                class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-brand-400 to-brand-500 hover:from-brand-500 hover:to-brand-600 text-white font-bold text-sm shadow-md shadow-brand-400/30 flex items-center justify-center gap-2 active:scale-[0.98] transition-all"
            >

                <span>
                    Continue to Fixtures
                </span>

                <span
                    class="material-symbols-outlined text-[20px]"
                >
                    arrow_forward
                </span>

            </button>

        </div>

    </main>



    <!-- ========================= -->
    <!-- STATE.JS -->
    <!-- ========================= -->

<script src="./js/state.js"></script>

    <!-- ========================= -->
    <!-- PAGE JAVASCRIPT -->
    <!-- ========================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                // =========================
                // LOAD STATE
                // =========================

                loadState();



                // =========================
                // ELEMENTS
                // =========================

                const slider =
                    document.getElementById(
                        "usage-slider"
                    );

                const valueDisplay =
                    document.getElementById(
                        "val-display"
                    );

                const usageTiers =
                    document.querySelectorAll(
                        ".usage-tier"
                    );

                const hourButtons =
                    document.querySelectorAll(
                        ".usage-hour"
                    );

                const continueButton =
                    document.getElementById(
                        "continue-to-fixtures"
                    );



                // =========================
                // MONTHLY USAGE
                // =========================

                slider.value =
                    LEAKLENS_STATE.monthly_usage_m3;

                valueDisplay.textContent =
                    LEAKLENS_STATE.monthly_usage_m3;


                slider.addEventListener(
                    "input",
                    function () {

                        LEAKLENS_STATE.monthly_usage_m3 =
                            Number(this.value);

                        valueDisplay.textContent =
                            this.value;

                        saveState();

                    }
                );



                // =========================
                // USAGE TIERS
                // =========================

                function selectTier(tier) {

                    usageTiers.forEach(
                        function (item) {

                            item.classList.remove(
                                "active-tier",
                                "bg-sky-50/80",
                                "border-2",
                                "border-brand-400"
                            );

                            item.classList.add(
                                "bg-white",
                                "border",
                                "border-sky-100"
                            );


                            const radio =
                                item.querySelector(
                                    ".tier-radio"
                                );

                            radio.className =
                                "w-6 h-6 rounded-full border-2 border-slate-200 flex items-center justify-center tier-radio";

                            radio.innerHTML = "";

                        }
                    );


                    tier.classList.remove(
                        "bg-white",
                        "border",
                        "border-sky-100"
                    );

                    tier.classList.add(
                        "active-tier",
                        "bg-sky-50/80",
                        "border-2",
                        "border-brand-400"
                    );


                    const radio =
                        tier.querySelector(
                            ".tier-radio"
                        );

                    radio.className =
                        "w-6 h-6 rounded-full bg-brand-500 text-white flex items-center justify-center tier-radio shadow-sm";

                    radio.innerHTML =
                        '<span class="material-symbols-outlined text-[16px] font-bold">check</span>';


                    const title =
                        tier.querySelector(
                            ".text-sm.font-bold"
                        )
                        .textContent
                        .trim();


                    if (title === "Low Usage") {

                        LEAKLENS_STATE.monthly_usage_m3 = 10;

                    } else if (title === "Medium Usage") {

                        LEAKLENS_STATE.monthly_usage_m3 = 20;

                    } else if (title === "High Usage") {

                        LEAKLENS_STATE.monthly_usage_m3 = 35;

                    }


                    slider.value =
                        LEAKLENS_STATE.monthly_usage_m3;

                    valueDisplay.textContent =
                        LEAKLENS_STATE.monthly_usage_m3;

                    saveState();

                }



                usageTiers.forEach(
                    function (tier) {

                        tier.addEventListener(
                            "click",
                            function () {

                                selectTier(this);

                            }
                        );

                    }
                );



                // =========================
                // USAGE HOURS
                // =========================

                function updateHourButton(button) {

                    const selected =
                        LEAKLENS_STATE.usage_hours.includes(
                            button.dataset.hour
                        );

                    const icon =
                        button.querySelector(
                            ".hour-check"
                        );


                    if (selected) {

                        button.classList.remove(
                            "bg-white",
                            "border-sky-100"
                        );

                        button.classList.add(
                            "bg-sky-50/70",
                            "border-brand-300"
                        );


                        icon.textContent =
                            "check_circle";

                        icon.classList.remove(
                            "text-slate-300"
                        );

                        icon.classList.add(
                            "text-brand-500"
                        );

                    } else {

                        button.classList.remove(
                            "bg-sky-50/70",
                            "border-brand-300"
                        );

                        button.classList.add(
                            "bg-white",
                            "border-sky-100"
                        );


                        icon.textContent =
                            "radio_button_unchecked";

                        icon.classList.remove(
                            "text-brand-500"
                        );

                        icon.classList.add(
                            "text-slate-300"
                        );

                    }

                }



                hourButtons.forEach(
                    function (button) {

                        button.addEventListener(
                            "click",
                            function () {

                                const hour =
                                    this.dataset.hour;


                                const index =
                                    LEAKLENS_STATE.usage_hours.indexOf(
                                        hour
                                    );


                                if (index === -1) {

                                    LEAKLENS_STATE.usage_hours.push(
                                        hour
                                    );

                                } else {

                                    LEAKLENS_STATE.usage_hours.splice(
                                        index,
                                        1
                                    );

                                }


                                updateHourButton(
                                    this
                                );

                                saveState();

                            }
                        );


                        updateHourButton(
                            button
                        );

                    }
                );



                // =========================
                // RESTORE SELECTED TIER
                // =========================

                if (
                    LEAKLENS_STATE.monthly_usage_m3 === 10
                ) {

                    selectTier(
                        usageTiers[0]
                    );

                } else if (
                    LEAKLENS_STATE.monthly_usage_m3 === 20
                ) {

                    selectTier(
                        usageTiers[1]
                    );

                } else if (
                    LEAKLENS_STATE.monthly_usage_m3 === 35
                ) {

                    selectTier(
                        usageTiers[2]
                    );

                }



                // =========================
                // CONTINUE
                // =========================

                continueButton.addEventListener(
                    "click",
                    function () {

                        saveState();

                        window.location.href =
                            "fixtures.html";

                    }
                );

            }
        );

    </script>

</body>

</html>
