<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>1. Log In & Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      overscroll-behavior-y: auto;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-sky-50 via-white to-sky-50 text-slate-800 min-h-screen flex flex-col justify-between overflow-y-auto">
  <div class="w-full max-w-md mx-auto px-6 py-8 flex flex-col min-h-screen">
    
    <!-- Top Branding with Logo + Tagline -->
    <header class="flex flex-col items-center pt-4 pb-6 text-center">
      <div class="flex items-center gap-3">
        <!-- Modern Wave Vector Logo -->
        <svg class="w-10 h-10 text-brand-500 drop-shadow-sm" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 16C12 12 18 20 24 16C30 12 36 20 42 16" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 24C12 20 18 28 24 24C30 20 36 28 42 24" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 32C12 28 18 36 24 32C30 28 36 36 42 32" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="text-2xl font-extrabold tracking-tight text-brand-600">LEAKLENS</span>
      </div>
      <!-- User Requested Tagline -->
      <p class="text-xs font-semibold text-brand-500 tracking-wide uppercase mt-1">The water you can't see</p>
    </header>

    <!-- Auth Tabs Switcher -->
    <div class="bg-sky-100/70 p-1.5 rounded-2xl flex items-center justify-between mb-6 shadow-inner">
      <button id="tab-login" class="flex-1 py-2.5 rounded-xl font-bold text-sm bg-white text-brand-600 shadow-sm transition-all flex items-center justify-center gap-1.5">
        <span class="material-symbols-outlined text-[18px]">login</span>
        Log In
      </button>
      <button id="tab-signup" class="flex-1 py-2.5 rounded-xl font-semibold text-sm text-slate-500 hover:text-slate-700 transition-all flex items-center justify-center gap-1.5">
        <span class="material-symbols-outlined text-[18px]">person_add</span>
        Sign Up
      </button>
    </div>

    <!-- Main Auth Card -->
    <div class="bg-white rounded-3xl p-6 shadow-[0_10px_30px_-5px_rgba(56,189,248,0.15)] border border-sky-100 flex-1 flex flex-col justify-center">
      <h2 class="text-lg font-bold text-slate-800 mb-1">Welcome back</h2>
      <p class="text-xs text-slate-500 mb-6">Enter your credentials to monitor your smart water flow.</p>

      <form class="space-y-4" onsubmit="event.preventDefault();">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
            <span class="material-symbols-outlined text-brand-500 text-[18px]">mail</span>
            Email address
          </label>
          <input type="email" placeholder="name@example.com" value="user@leaklens.io" class="w-full px-4 py-3 rounded-2xl bg-sky-50/50 border border-sky-200 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:bg-white transition-all">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider flex items-center gap-1.5">
              <span class="material-symbols-outlined text-brand-500 text-[18px]">lock</span>
              Password
            </label>
            <a href="#" class="text-xs font-semibold text-brand-500 hover:text-brand-600">Forgot?</a>
          </div>
          <div class="relative">
            <input type="password" value="••••••••••••" class="w-full px-4 py-3 rounded-2xl bg-sky-50/50 border border-sky-200 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:bg-white transition-all pr-11">
            <button type="button" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <span class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full mt-2 py-3.5 px-4 rounded-2xl bg-gradient-to-r from-brand-400 to-brand-500 hover:from-brand-500 hover:to-brand-600 text-white font-bold text-sm shadow-md shadow-brand-400/30 flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
          <span>Log In</span>
          <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
        </button>
      </form>

      <!-- Social login divider -->
      <div class="relative my-6 text-center">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
        <span class="relative bg-white px-3 text-xs text-slate-400 font-medium">Or continue with</span>
      </div>

      <!-- Quick Social Buttons -->
      <div class="grid grid-cols-2 gap-3">
        <button class="py-2.5 px-3 rounded-xl border border-sky-200 hover:bg-sky-50/60 font-semibold text-xs text-slate-700 flex items-center justify-center gap-2 transition-all">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
          Google
        </button>
        <button class="py-2.5 px-3 rounded-xl border border-sky-200 hover:bg-sky-50/60 font-semibold text-xs text-slate-700 flex items-center justify-center gap-2 transition-all">
          <svg class="w-4 h-4 fill-current text-slate-800" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.84c.66-.8 1.11-1.92.99-3.04-.96.04-2.13.64-2.82 1.45-.61.71-1.14 1.86-1 2.97 1.07.08 2.17-.58 2.83-1.38z"/></svg>
          Apple
        </button>
      </div>
    </div>

    <!-- Footer Switch -->
    <div class="pt-6 pb-2 text-center text-xs text-slate-500">
      New to LEAKLENS? <a href="#" class="font-bold text-brand-500 hover:text-brand-600">Create an account</a>
    </div>

  </div>
</body>
</html>
