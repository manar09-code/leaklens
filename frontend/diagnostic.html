<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>Analyzing | LEAKLENS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1'
                        }
                    },

                    fontFamily: {
                        sans: [
                            'Plus Jakarta Sans',
                            'sans-serif'
                        ]
                    }
                }
            }
        };
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>


<body class="bg-gradient-to-b from-sky-50 via-white to-sky-50 text-slate-800 min-h-screen flex flex-col">


    <!-- HEADER -->

    <header class="bg-white/85 backdrop-blur-md border-b border-sky-100 px-4 py-3">

        <div class="max-w-md mx-auto flex items-center gap-2.5">

            <button
                id="back-button"
                type="button"
                aria-label="Go back to fixtures"
                class="w-8 h-8 rounded-full bg-sky-50 hover:bg-sky-100 flex items-center justify-center text-slate-600 transition-colors"
            >
                <span class="material-symbols-outlined text-[18px]">arrow_back</span>
            </button>

            <div class="flex items-center gap-2.5">

                <svg
                    class="w-5 h-5 text-brand-500"
                    viewBox="0 0 48 48"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path
                        d="M6 16C12 12 18 20 24 16C30 12 36 20 42 16"
                        stroke="currentColor"
                        stroke-width="4.5"
                        stroke-linecap="round"
                    />

                    <path
                        d="M6 24C12 20 18 28 24 24C30 20 36 28 42 24"
                        stroke="currentColor"
                        stroke-width="4.5"
                        stroke-linecap="round"
                    />

                    <path
                        d="M6 32C12 28 18 36 24 32C30 28 36 36 42 32"
                        stroke="currentColor"
                        stroke-width="4.5"
                        stroke-linecap="round"
                    />

                </svg>


                <div class="flex flex-col">

                    <span class="text-base font-extrabold tracking-tight text-brand-600 leading-none">
                        LEAKLENS
                    </span>

                    <span class="text-[10px] font-bold text-brand-400 tracking-wide leading-tight">
                        The water you can't see
                    </span>

                </div>

            </div>

        </div>

    </header>



    <!-- MAIN -->

    <main class="flex-1 flex items-center justify-center px-5">

        <div class="w-full max-w-md text-center">


            <!-- ANIMATION -->

            <div class="relative w-28 h-28 mx-auto mb-8">

                <div class="absolute inset-0 rounded-full bg-brand-100 animate-ping opacity-40"></div>

                <div class="absolute inset-3 rounded-full bg-brand-50 flex items-center justify-center">

                    <span class="material-symbols-outlined text-brand-500 text-[48px]">
                        water_drop
                    </span>

                </div>

            </div>



            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">
                Analyzing Your Water Usage
            </h1>


            <p class="text-sm text-slate-500 mt-3 max-w-sm mx-auto leading-6">
                LEAKLENS is analyzing your household profile and looking for unusual consumption patterns.
            </p>



            <!-- STEPS -->

            <div class="mt-8 bg-white rounded-2xl border border-sky-100 shadow-sm p-5 text-left space-y-4">

                <div class="flex items-center gap-3">

                    <div class="w-8 h-8 rounded-full bg-brand-500 text-white flex items-center justify-center">

                        <span class="material-symbols-outlined text-[18px]">
                            check
                        </span>

                    </div>

                    <span class="text-xs font-semibold text-slate-700">
                        Household profile received
                    </span>

                </div>


                <div class="flex items-center gap-3">

                    <div class="w-8 h-8 rounded-full bg-brand-500 text-white flex items-center justify-center">

                        <span class="material-symbols-outlined text-[18px]">
                            check
                        </span>

                    </div>

                    <span class="text-xs font-semibold text-slate-700">
                        Consumption pattern analyzed
                    </span>

                </div>


                <div class="flex items-center gap-3">

                    <div class="w-8 h-8 rounded-full bg-sky-100 text-brand-500 flex items-center justify-center">

                        <span class="material-symbols-outlined text-[18px] animate-spin">
                            progress_activity
                        </span>

                    </div>

                    <span class="text-xs font-semibold text-slate-700">
                        Generating leak assessment...
                    </span>

                </div>

            </div>

        </div>

    </main>



    <!-- SHARED STATE -->

    <script src="./js/state.js"></script>

    <!-- API -->

    <script src="./js/api.js"></script>


    <script>

        document.addEventListener("DOMContentLoaded", async function () {

            document.getElementById("back-button")?.addEventListener("click", function () {
                window.location.href = "fixtures.html";
            });

            const state = loadState();

            try {

                const diagnostic =
                    await runLeakDiagnostic(state);


                /*
                 * Save diagnostic result separately
                 */

                localStorage.setItem(
                    "leaklens_diagnostic",
                    JSON.stringify(diagnostic)
                );


                /*
                 * Go to final results
                 */

                window.location.href =
                    "results.html";

            } catch (error) {

                console.error(
                    "Diagnostic failed:",
                    error
                );


                document.querySelector("main").innerHTML = `

                    <div class="w-full max-w-md text-center px-5">

                        <div class="w-16 h-16 mx-auto rounded-full bg-red-50 flex items-center justify-center mb-5">

                            <span class="material-symbols-outlined text-red-500 text-[32px]">
                                error
                            </span>

                        </div>

                        <h1 class="text-xl font-extrabold text-slate-800">
                            Diagnostic Failed
                        </h1>

                        <p class="text-xs text-slate-500 mt-2 leading-5">
                            We couldn't complete the analysis. Please try again.
                        </p>

                        <button
                            onclick="window.location.href='fixtures.html'"
                            class="mt-6 w-full py-4 rounded-2xl bg-gradient-to-r from-brand-400 to-brand-500 text-white font-bold text-sm"
                        >
                            Try Again
                        </button>

                    </div>

                `;

            }

        });

    </script>

    <script src="./js/navigation.js?v=4"></script>\n</body>

</html>
